name: Deploy

on:
  push:
    branches: [main]
    tags: ['apk-*']
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push Docker images
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scripts image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.scripts
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse-scripts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-apk:
    name: Build Android APK (Gradle)
    if: startsWith(github.ref, 'refs/tags/apk-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Write mobile .env
        run: |
          echo "EXPO_PUBLIC_API_BASE=${{ secrets.EXPO_PUBLIC_API_BASE }}" > apps/mobile/.env
          echo "EXPO_PUBLIC_BUILD_TAG=${{ github.ref_name }}" >> apps/mobile/.env
      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a
      - name: Rename APK
        id: apk
        run: |
          TIMESTAMP=$(date -u +'%m%d%Y-%H%M')
          APK_NAME="pulse-${TIMESTAMP}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.apk.outputs.name }}
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: Pulse CI <${{ secrets.NOTIFY_EMAIL }}>
          subject: "Pulse APK build complete — ${{ steps.apk.outputs.name }}"
          body: |
            Build succeeded for ${{ steps.apk.outputs.name }}.

            Direct download:
            ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.apk.outputs.name }}
