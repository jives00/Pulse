name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Load app env vars
            set -a; source /etc/pulse.env; set +a

            export PATH="/home/ubuntu/.nvm/versions/node/v20.20.2/bin:$PATH"

            cd ~/pulse-app
            git pull origin main

            # Install all deps
            npm ci

            # Run DB migrations (idempotent — safe to run on every deploy)
            npm run migrate --workspace=apps/server

            # Build server and web
            npm run build --workspace=apps/server
            npm run build --workspace=apps/web

            # Restart server
            pm2 restart pulse-server --update-env

            echo "Deployed at $(date)"

  # EAS mobile build — disabled until Phase 5
  build-apk:
    name: Build Android APK (EAS)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive
