name: Deploy

on:
  push:
    branches: [main]
    tags: ['apk-*']
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            # Load app env vars
            set -a; source /etc/pulse.env; set +a

            export PATH="/home/ubuntu/.nvm/versions/node/v24.15.0/bin:$PATH"

            cd ~/pulse-app
            git checkout -- package.json package-lock.json
            git pull origin main

            # Clean all node_modules (root + workspaces) before install to avoid ENOTEMPTY errors
            rm -rf node_modules apps/*/node_modules packages/*/node_modules

            # Exclude mobile workspace so Expo/React Native aren't installed on EC2
            # (mobile is built via EAS — package.json is restored after prune)
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.workspaces=p.workspaces.filter(w=>w.indexOf('mobile')===-1); fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
            npm install

            # Run DB migrations (idempotent — safe to run on every deploy)
            npm run migrate --workspace=apps/server

            # Build server and web
            npm run build --workspace=apps/server
            npm run build --workspace=apps/web

            # Prune devDeps while package.json still excludes mobile (prevents mobile deps being re-added)
            npm prune --omit=dev

            # Restore package.json and package-lock.json so git stays clean
            git checkout package.json package-lock.json

            # Restart server
            pm2 restart pulse-server --update-env

            echo "Deployed at $(date)"

  build-apk:
    name: Build Android APK (Gradle)
    if: startsWith(github.ref, 'refs/tags/apk-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
